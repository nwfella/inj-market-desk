name: refresh

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep all derivative markets
        run: python engine/injdesk.py sweep --threads 6

      - name: Build site
        run: python build_site.py

      - name: Gate
        run: node scripts/verify_site.js

      - name: Commit snapshot + site
        run: |
          git config user.name  "market-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
